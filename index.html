<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZoeGens</title>
    <meta name="description" content="Agenda compartida en tiempo real" />
    <link rel="icon" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f0f13" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZoeGens" />
    <style>
      :root{--bg:#0f0f13;--card:#131318;--card2:#1a1a22;--border:#1e1e2a;--border2:#2a2a3a;--border3:#3a3a4a;--text:#e8e8f0;--title:#fff;--bar:#0a0a0e;--g3:#333;--g4:#80808c;--g5:#8e8e9a;--g6:#9c9ca8;--g8:#b0b0bb;--ga:#c6c6d0;--ok:#5CCB8B;--warn:#F2B84B;--danger:#F0605A}
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: var(--bg); overflow-x: hidden; }
      #root { height: 100%; }

      /* Portrait mobile: sin sidebar, sin bottom nav, con tabs arriba */
      .sidebar { display: none !important; }
      .bottom-nav { display: none !important; }
      .desktop-filters { display: none !important; }
      .mobile-tabs { display: flex !important; }

      /* Landscape mobile y tablet+: sidebar visible, bottom nav oculto */
      @media (min-width: 768px), (orientation: landscape) {
        .sidebar { display: flex !important; }
        .bottom-nav { display: none !important; }
        .desktop-filters { display: flex !important; }
        .mobile-tabs { display: none !important; }
      }

      /* Desktop grande siempre sidebar */
      @media (min-width: 1024px) {
        .sidebar { display: flex !important; }
        .bottom-nav { display: none !important; }
        .desktop-filters { display: flex !important; }
        .mobile-tabs { display: none !important; }
      }

      @media (max-width: 480px) and (orientation: portrait) {
        .day-cell { min-height: 52px !important; padding: 3px 2px !important; }
      }
      /* Calendario: puntos de color en celular, chips con texto en pantallas anchas */
      .cal-chips { display: none; }
      @media (min-width: 768px) {
        .cal-chips { display: block !important; }
        .cal-dots { display: none !important; }
        .day-cell { min-height: 90px !important; }
        .modal-overlay { align-items: center !important; }
        .modal-box { border-radius: 16px !important; align-self: center; max-height: 85vh !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
